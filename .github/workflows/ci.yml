name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check that no secrets or local data are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.sqlite$|^instance/'; then
            echo "A secret or local data file is tracked"; exit 1
          fi
          if git grep -nE '[0-9a-f]{64}' -- .env.example app; then
            echo "A 64-character hex string was found in code or .env.example"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=95