{% extends "base.html" %}

{% block title %}Log in - EviTrack{% endblock %}

{% block content %}

<div class="page-header">
  <div>
    <h1>Log in</h1>
    <p class="subtitle">Access the EviTrack evidence management system.</p>
  </div>
</div>

<form method="post" class="card">

  <input
    type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label for="username">Username</label>
  <input
    name="username"
    id="username"
    required
    autofocus
    autocomplete="username"
  >

  <label for="password">Password</label>
  <input
    type="password"
    name="password"
    id="password"
    required
    autocomplete="current-password"
  >

  <button type="submit">Log in</button>

</form>

{% endblock %}
