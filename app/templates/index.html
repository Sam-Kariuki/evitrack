{% extends "base.html" %}
{% block content %}
  <h1>EviTrack</h1>
  <p>Secure digital evidence and chain-of-custody manager.</p>
  {% if g.user %}
    <p>Signed in as <strong>{{ g.user['username'] }}</strong>.</p>
  {% else %}
    <p><a href="{{ url_for('auth.login') }}">Log in</a> to continue.</p>
  {% endif %}
{% endblock %}
